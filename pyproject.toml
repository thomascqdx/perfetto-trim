[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfetto-trim"
dynamic = ["version"]
description = "Perfetto Trim - trim/split large Android perfetto traces with bounded memory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
perfetto-trim = "pftrim.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pftrim.web" = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "pftrim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not perf"'
markers = [
    "tp: needs trace_processor binary",
    "sample: needs testdata sample trace",
    "perf: slow performance tests (deselected by default)",
]
